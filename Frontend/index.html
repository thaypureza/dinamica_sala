    <link rel="stylesheet" href="style.css">
    <title>Pratica_chefs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
    <div class="cabecalho">
        <div class="secao_usuario">
            <img id="foto_usuario" src="anexos_prova/imagens_usuarios/usuario1.jpg" alt="usuario1">
            <div class="perfil">
                <p id="nome_usuario"> SAEPChef</p>
                <button disabled class="btn-perfil">Ver Perfil</button>
            </div>
        </div>
        <div class="secao_empresa">
            SAEPChef
        </div>
        <div class="modal">
            <button id="btn-login">Login</button>
            <div id="modal-container" class="modal-container">
                <div class="modal-conteudo">
                    <h2>Login</h2>
                    <form id="form-login">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" required>
                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" name="senha" required>
                        <button type="submit">Entrar</button>
                        <span id="btn-fechar" class="btn-fechar">&times;</span>
                    </form>
                </div>
            </div>

        </div>
    </div>
    <div class="campo-busca">
        <input id="barra-pesquisa" type="text" placeholder="Digite o nome do chef... ex: @chef1">
        <img src="anexos_prova/icones/lupa.svg" alt="Icone lupa" id="icone-lupa">
    </div>
